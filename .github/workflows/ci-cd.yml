name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt


      - name: Generate synthetic placeholder data
        # data/*.csv is gitignored (ADR-003) -- CI has no Kaggle credentials
        # to pull the real dataset, so it runs against the same synthetic
        # stand-in every notebook and test in this repo already uses.
        run: python scripts/generate_synthetic.py

      - name: Prepare test dataset
        run: |
          mkdir -p data/raw
          cp data/sample_synthetic.csv data/raw/telco_churn.csv

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short
        env:
          REDIS_HOST: localhost

  # Builds both images and brings the full docker-compose stack up against
  # a real health check on every push. This is the actual verification for
  # ADR-015's Docker build-test caveat.
  # No registry push: this portfolio project has no real registry/credentials.

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generate synthetic placeholder data
        run: python scripts/generate_synthetic.py

      - name: Prepare test dataset
        run: |
          mkdir -p data/raw
          cp data/sample_synthetic.csv data/raw/telco_churn.csv

      - name: Build images
        run: docker compose build

      - name: Bring up the full stack
        run: docker compose up -d

      - name: Wait for API health check
        run: timeout 120 bash -c 'until curl -sf http://localhost:8000/health; do sleep 3; done'

      - name: Wait for dashboard health check
        run: timeout 60 bash -c 'until curl -sf http://localhost:8501/_stcore/health; do sleep 3; done'

      - name: Show container status on failure
        if: failure()
        run: docker compose ps && docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v