name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build, lint, and test web client
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generate synthetic placeholder data
        run: python scripts/generate_synthetic.py

      - name: Prepare test dataset
        run: |
          mkdir -p data/raw
          cp data/sample_synthetic.csv data/raw/telco_churn.csv

      - name: Run Python test suite
        run: python -m pytest tests/ -v --tb=short
        env:
          REDIS_HOST: localhost
          ALLOW_SYNTHETIC_DATA: "1"
          FORCE_RETRAIN: "1"

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generate synthetic placeholder data
        run: python scripts/generate_synthetic.py

      - name: Prepare test dataset
        run: |
          mkdir -p data/raw
          cp data/sample_synthetic.csv data/raw/telco_churn.csv

      - name: Build Docker images
        run: docker compose build

      - name: Bring up stack
        run: ALLOW_SYNTHETIC_DATA=1 FORCE_RETRAIN=1 docker compose up -d

      - name: Wait for API health check
        run: timeout 120 bash -c 'until curl -sf http://localhost:8000/health || curl -sf http://localhost:8000/api/v1/health; do sleep 3; done'

      - name: Verify React client and proxied API
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3000/ > /dev/null; do sleep 2; done'
          curl -sf http://localhost:8000/api/v1/health

      - name: Run E2E smoke tests against live stack
        run: |
          python -m pytest tests/test_e2e_smoke.py -v
        env:
          SMOKE_TEST_URL: http://localhost:8000

      - name: Show container status on failure
        if: failure()
        run: docker compose ps && docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
