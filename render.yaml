services:
  # ---------------------------------------------------------------------------
  # 1. RetentionAI FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: retentionai-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ALLOW_SYNTHETIC_DATA
        value: "0"
      - key: FORCE_RETRAIN
        value: "0"
      - key: REDIS_URL
        sync: false # Set in Render dashboard or linked from Upstash

  # ---------------------------------------------------------------------------
  # 2. RetentionAI React 19 Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: retentionai-web
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: retentionai-api
          property: url
